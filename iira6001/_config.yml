# In _config.yml

title: Programmering til dataanalyse
author: Hans Georg Schaathun og Jonas Julius Harang
copyright: "2025"
logo: ntnu.svg
execute:
  execute_notebooks: cache
  timeout: 420 
  exclude_patterns:
    - "norun/*"            # This skips execution for everything in that folder

    
# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - hgs.bib


sphinx: 
    extra_extensions:
        - sphinx_iframes
        - jupyterbook_patches
    config:
      suppress_warnings: ["mystnb.unknown_mime_type"]
      html_js_files:
        - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
parse:
    myst_enable_extensions:
        - amsmath
        - attrs_block
        - attrs_inline
        - colon_fence
        - deflist
        - dollarmath
        - linkify
        - smartquotes
        - strikethrough
        - tasklist

