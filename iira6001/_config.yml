# In _config.yml

title: Data og programmering for ulike fag
author: Hans Georg Schaathun og Jonas Julius Harang
copyright: "2025"
logo: ntnu.svg
execute:
  execute_notebooks: force
  timeout: 420 

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - hgs.bib


sphinx: 
    extra_extensions:
        - sphinx_iframes

parse:
    myst_enable_extensions:
        - amsmath
        - attrs_block
        - attrs_inline
        - colon_fence
        - deflist
        - dollarmath
        - linkify
        - smartquotes
        - strikethrough
